[build-system]
requires = ["maturin>=1.16,<2.0"]
build-backend = "maturin"

[project]
name = "tensortrail"
version = "0.1.0"
description = "High-performance numerical drift detection and debugging for machine-learning inference"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "TensorTrail contributors" }]
requires-python = ">=3.11"
keywords = ["numerical-debugging", "machine-learning", "inference", "drift", "rust", "numpy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = [
  "maturin>=1.16,<2.0",
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]
torch = ["torch>=2.0"]
benchmark = ["psutil>=5.9"]
all = ["torch>=2.0", "psutil>=5.9"]

[project.urls]
Homepage = "https://github.com/leaderofARS/tensortrail"
Repository = "https://github.com/leaderofARS/tensortrail"
Issues = "https://github.com/leaderofARS/tensortrail/issues"
Documentation = "https://github.com/leaderofARS/tensortrail/blob/main/docs/engineering_report.md"

[tool.maturin]
python-source = "python"
module-name = "tensortrail._core"
manifest-path = "native/tensortrail-core/Cargo.toml"
features = ["extension-module"]
strip = true
# The native extension is an implementation detail; users import tensortrail.
include = [
  { path = "python/tensortrail/py.typed", format = ["sdist", "wheel"] },
  { path = "tests/**/*.py", format = "sdist" },
  { path = "docs/**/*.md", format = "sdist" },
  { path = "benchmarks/**/*.py", format = "sdist" },
  { path = "benchmarks/results/*", format = "sdist" },
  { path = "CONTRIBUTING.md", format = "sdist" },
  { path = "CHANGELOG.md", format = "sdist" },
  { path = "CODE_OF_CONDUCT.md", format = "sdist" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
minversion = "8.0"
addopts = "-ra"
markers = [
  "native: requires the compiled native extension",
  "torch: requires PyTorch",
  "slow: long-running numerical or performance test",
]

[tool.coverage.run]
source = ["tensortrail"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["python", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ARG", "PTH"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "S101"]
"benchmarks/**" = ["ARG001"]

[tool.mypy]
python_version = "3.11"
mypy_path = "python"
files = ["python/tensortrail"]
strict = true
warn_unused_ignores = true
show_error_codes = true
