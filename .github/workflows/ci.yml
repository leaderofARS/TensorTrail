name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PYTHONUNBUFFERED: "1"

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Formatting
        run: cargo fmt --manifest-path native/tensortrail-core/Cargo.toml --all -- --check
      - name: Clippy
        run: >-
          cargo clippy
          --manifest-path native/tensortrail-core/Cargo.toml
          --all-targets --all-features -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path native/tensortrail-core/Cargo.toml --release

  python-lint:
    name: Python lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install tools
        run: python -m pip install "ruff>=0.6" "mypy>=1.10" "numpy>=1.24"
      - name: Ruff
        run: ruff check python tests benchmarks
      - name: Mypy
        run: mypy

  test:
    name: Test ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "maturin>=1.16,<2.0" "numpy>=1.24" pytest
      - name: Build the native extension
        run: maturin build --release --out dist --interpreter python
      - name: Install the built wheel
        shell: bash
        run: python -m pip install --no-deps --force-reinstall dist/*.whl
      - name: Verify native import
        run: python -c "import tensortrail as tt; print(tt.__version__, tt.native_info())"
      - name: Run tests
        run: pytest -q

  numpy-floor:
    name: NumPy 1.24 floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Install the supported dependency floor
        run: |
          python -m pip install --upgrade pip
          python -m pip install "maturin>=1.16,<2.0" "numpy==1.24.4" pytest
      - name: Build against NumPy 1.24
        run: maturin build --release --out dist --interpreter python
      - name: Install the built wheel
        run: python -m pip install --no-deps --force-reinstall dist/*.whl
      - name: Run tests
        run: pytest -q

  package:
    name: Build and inspect distributions
    runs-on: ubuntu-latest
    needs: [rust, python-lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip
          python -m pip install "maturin>=1.16,<2.0" twine "numpy>=1.24"
          maturin build --release --sdist --out dist
      - name: Validate metadata
        run: python -m twine check dist/*
      - name: Inspect sdist contents
        run: tar -tzf dist/tensortrail-*.tar.gz
      - name: Install the wheel
        run: python -m pip install --no-deps --force-reinstall dist/*.whl
      - name: Clean-install smoke test
        run: |
          python -c "
          import numpy as np
          import tensortrail as tt

          reference = np.array([1.0, 2.0, 3.0, 4.0], dtype=np.float32)
          candidate = np.array([1.0, 4.0, 2.0, 8.0], dtype=np.float32)
          report = tt.compare(reference, candidate)
          assert report.metrics.mae == 1.75
          assert report.status == 'fail'
          assert report.metadata.backend == 'rust'
          print(tt.__version__, report.summary())
          "
      - uses: actions/upload-artifact@v4
        with:
          name: tensortrail-dist
          path: dist/
          retention-days: 7
